<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#22408F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ tạp hóa">
<title>Sổ tạp hóa</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="root"><div class="boot"><p class="muted">Đang mở ứng dụng…</p></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="modal"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/util.js"></script>
<script src="js/idb.js"></script>
<script src="js/xlsx-lite.js"></script>
<script src="js/sync.js"></script>
<script src="js/views.js"></script>
<script src="js/app.js"></script>
<script>
/* Chẩn đoán: nếu sau 6 giây vẫn kẹt ở "Đang mở ứng dụng…" thì báo rõ thiếu gì */
(function () {
  var firstErr = '';
  window.addEventListener('error', function (e) {
    if (!firstErr) firstErr = (e.message || '') + (e.filename ? ' (' + e.filename.split('/').slice(-2).join('/') + ')' : '');
  });
  setTimeout(function () {
    var r = document.getElementById('root');
    if (!r || !r.querySelector('.boot p.muted')) return;
    var need = ['APP_CONFIG', 'supabase', 'U', 'DB', 'XL', 'Sync', 'Views', 'App'];
    var names = { APP_CONFIG: 'config.js', supabase: 'thư viện kết nối (cần Internet)', U: 'js/util.js', DB: 'js/idb.js', XL: 'js/xlsx-lite.js', Sync: 'js/sync.js', Views: 'js/views.js', App: 'js/app.js' };
    var miss = need.filter(function (k) { return !window[k]; }).map(function (k) { return names[k]; });
    var h = '<div class="card auth"><h1>Ứng dụng chưa mở được</h1>';
    if (miss.length) h += '<p class="sub">Không tải được: <b>' + miss.join(', ') + '</b>.<br>Hãy kiểm tra các file này đã được tải lên đúng chỗ chưa (thư mục <b>js</b> nằm cùng cấp với index.html).</p>';
    else h += '<p class="sub">Các file đã tải đủ nhưng ứng dụng không khởi động được.</p>';
    if (firstErr) h += '<p class="mono">' + firstErr.replace(/</g, '&lt;') + '</p>';
    h += '<button class="btn primary block" onclick="location.reload()">Tải lại</button></div>';
    r.querySelector('.boot').innerHTML = h;
  }, 6000);
})();
</script>
</body>
</html>
